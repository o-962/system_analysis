<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Systems Analysis Study</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('sa-theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE calm study notebook: quiet, roomy, easy to read for long sessions
   IDEA a clean course reader with a margin index, like a well-made textbook
   PICTURE the lesson itself is the picture; diagrams are drawn simply in soft fills
   COLOUR white page, soft grey surfaces, slate ink, one muted blue accent; green/red only for right/wrong
   TYPE Inter throughout, generous line height
   LAYOUT top bar; chapter = slim section list + content filling the remaining width; one column below 900px */
:root{color-scheme:light;
--bg:#ffffff;--surface:#f6f7f9;--surface-2:#eef0f4;--ink:#1f2933;--mute:#66707d;--line:#e3e6eb;
--acc:#3b5b92;--acc-soft:#e8eef8;--acc-ink:#ffffff;
--ok:#2f7d5b;--ok-soft:#e9f5ef;--bad:#b4473c;--bad-soft:#fbeeec;
--note:#fdf8e7;--note-line:#e8d48a;--trap:#fbf1ea;--trap-line:#e3b48f;--ex-line:#cbd8ee;--ok-line:#a9d3bf;--bad-line:#e6b9b3;--hover-line:#b7c4da;--top-bg:rgba(255,255,255,.94);--shadow:rgba(31,41,51,.06)}
:root[data-theme=dark]{color-scheme:dark;
--bg:#14171c;--surface:#1b1f26;--surface-2:#262b34;--ink:#e4e7ec;--mute:#9aa3b0;--line:#2c323c;
--acc:#8fb0e6;--acc-soft:#1f2a3d;--acc-ink:#0f1520;
--ok:#6cc49a;--ok-soft:#16281f;--bad:#e8897e;--bad-soft:#2e1a19;
--note:#262214;--note-line:#5c5023;--trap:#2a1f17;--trap-line:#6b4a2e;--ex-line:#34476a;--ok-line:#2f6048;--bad-line:#6e3832;--hover-line:#4a5a75;--top-bg:rgba(20,23,28,.94);--shadow:rgba(0,0,0,.35)}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
img{max-width:100%}
h1,h2,h3,h4,h5{line-height:1.25;letter-spacing:-.015em;margin:0 0 .6em;font-weight:600;text-wrap:balance}
h1{font-size:clamp(28px,3.4vw,38px)}h2{font-size:clamp(23px,2.6vw,29px)}h3{font-size:19px}h4{font-size:17px;margin-top:2em}h5{font-size:16px}
p{margin:0 0 1em}
.wrap{max-width:1440px;margin-inline:auto;padding-inline:clamp(16px,3.5vw,48px)}
.page{padding-block:48px 72px}
.narrow{max-width:1000px}
.muted{color:var(--mute)}.small{font-size:14px}.center{text-align:center}
.lead{font-size:18px;color:var(--mute);max-width:760px}
.eyebrow{display:block;font-size:13px;font-weight:600;color:var(--acc);margin:0 0 8px}
.empty{padding:32px;background:var(--surface);border-radius:12px;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.plain{list-style:none;margin:0;padding:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 20px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;text-align:left}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--bg);color:var(--acc);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--acc);background:var(--acc-soft)}
.btn.ghost.on{background:var(--acc-soft);border-color:var(--acc)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn.small{min-height:36px;padding:6px 14px;font-size:14px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--acc);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hover-line)}
.link:hover{text-decoration-color:var(--acc)}
:is(.btn,.link,.opt,.chip,.sec,a,select,textarea,input):focus-visible{outline:3px solid #9db4dc;outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--top-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:32px;min-height:64px}
.brand{font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1}
.nav a{flex:none;padding:8px 14px;border-radius:8px;color:var(--mute);text-decoration:none;font-size:15px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a.on{color:var(--acc);background:var(--acc-soft);font-weight:500}

.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.theme-btn,.menu-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.theme-btn:hover,.menu-btn:hover{border-color:var(--hover-line)}
.menu-btn{display:none}
.tabs{display:flex;gap:6px;padding:4px;margin:8px 0 32px;background:var(--surface);border-radius:12px;width:max-content;max-width:100%}
.tab{min-height:42px;padding:8px 18px;border:0;border-radius:9px;background:none;color:var(--mute);font:inherit;font-weight:500;cursor:pointer}
.tab.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
.part{margin-top:40px}
.part-title{padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid var(--line);font-size:18px}
.hint{margin:-10px 0 14px}
.calc{display:grid;gap:10px;margin-bottom:18px}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 200px auto;gap:14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px}
.calc-row.ok{border-color:var(--ok-line);background:var(--ok-soft)}.calc-row.bad{border-color:var(--bad-line);background:var(--bad-soft)}
.calc-row input{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-variant-numeric:tabular-nums}
.calc-row input:focus{border-color:var(--acc);outline:none}
.calc-ans{font-size:14px;font-weight:600;white-space:nowrap}
.calc-row.ok .calc-ans{color:var(--ok)}.calc-row.bad .calc-ans{color:var(--bad)}
.mobile-bar{display:none}
.nav-toggle{display:inline-flex;align-items:center;gap:8px;min-height:40px;margin:-12px 0 28px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--mute);font:inherit;font-size:14px;cursor:pointer}
.nav-toggle:hover{color:var(--ink);border-color:var(--hover-line)}
.ch-grid.nav-closed{grid-template-columns:minmax(0,1fr)}
.ch-grid.nav-closed aside{display:none}
.kbd{font:inherit;font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--mute)}
.search-backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:8vh 16px 16px}
.search-box{width:100%;max-width:760px;max-height:84vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.search-head{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line);color:var(--mute)}
.search-head input{flex:1;min-height:44px;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;outline:none}
.search-filters{margin:0;padding:12px 16px 4px}
.search-results{overflow-y:auto;padding:6px 8px 12px}
.search-empty{padding:16px 12px;margin:0}
.result-item{display:grid;gap:4px;width:100%;padding:12px 14px;border:0;border-radius:10px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.result-item.active{background:var(--surface)}
.result-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.kind{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.k-Lesson{background:var(--acc-soft);color:var(--acc)}.k-Flashcard{background:var(--note);color:var(--ink)}
.result-title{font-weight:500;line-height:1.45}
.result-snip{font-size:14px;color:var(--mute);line-height:1.5}
mark{background:#ffe58f;color:#1f2933;border-radius:3px;padding:0 2px}
:root[data-theme=dark] mark{background:#6b5a14;color:#fff3c4}
.flash-hit{outline:3px solid var(--acc);outline-offset:4px;transition:outline-color 1.5s}
.icon-btn{flex:none;width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:default}
.sticky-summary{position:sticky;bottom:12px;z-index:3;box-shadow:0 4px 18px var(--shadow)}

/* home */
.home{padding-block:56px 72px}
.intro{margin-bottom:48px}
.intro .lead{margin-bottom:28px}
.chapters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:48px}
.ch-card{display:grid;gap:10px;align-content:start;padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);text-decoration:none;transition:border-color .15s,box-shadow .15s}
.ch-card:hover{border-color:var(--hover-line);box-shadow:0 6px 24px var(--shadow)}
.ch-title{font-size:20px;font-weight:600;line-height:1.3}
.progress{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress span{display:block;height:100%;background:var(--acc);border-radius:3px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-bottom:24px}
.panel{padding:28px;border-radius:16px;background:var(--surface)}
.weak li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.weak li:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0}
.stats div{background:var(--bg);border-radius:12px;padding:16px}
.stats dt{font-size:14px;color:var(--mute)}
.stats dd{margin:4px 0 0;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.note-panel p:last-child{margin:0}

/* chapter */
.chapter{padding-block:40px 72px}
.ch-head{margin-bottom:40px;max-width:900px}
.ch-head .progress{max-width:420px;margin:14px 0 10px}
.ch-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:56px;align-items:start}
.ch-grid aside{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow:auto;padding-right:6px}
.jump{flex:1;width:100%;min-height:46px;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.sec-group{margin-bottom:24px}
.sec-label{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px;padding-left:10px}
.sections ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sec{display:flex;align-items:flex-start;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;font:inherit;font-size:14.5px;line-height:1.4;color:var(--ink);text-align:left;cursor:pointer}
.sec:hover{background:var(--surface)}
.sec.cur{background:var(--acc-soft);color:var(--acc);font-weight:500}
.tick{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--mute)}
.tick.done{background:var(--ok);color:var(--bg)}
.sec-t{flex:1}
.sec-x{flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--surface-2);color:var(--mute)}
.lesson h2{margin-bottom:28px}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
.pager .btn{max-width:48%}

/* lesson body: uses the full content width */
.body{font-size:16.5px}
.body ul,.body ol{padding-left:1.4em;margin:0 0 1.2em}
.body li{margin-bottom:.4em}
.body code{background:var(--surface);padding:2px 7px;border-radius:6px;font-size:.92em}
blockquote{margin:0 0 1.6em;padding:20px 24px;border-left:3px solid var(--acc);background:var(--surface);border-radius:0 10px 10px 0;font-size:17px}
.note,.ex,.trap,.extra{margin:24px 0;padding:18px 22px;border-radius:12px}
.note{background:var(--note);border:1px solid var(--note-line)}
.ex{background:var(--acc-soft);border:1px solid var(--ex-line)}
.trap{background:var(--trap);border:1px solid var(--trap-line)}
.extra{background:var(--bg);border:1px dashed var(--hover-line)}
:is(.note,.ex,.trap,.extra) ul{margin:.5em 0 0}
:is(.note,.ex,.trap,.extra) > :last-child{margin-bottom:0}
.formula{margin:20px 0;padding:18px 22px;background:var(--surface);border-radius:12px;font-variant-numeric:tabular-nums;line-height:1.9}
.tbl{overflow-x:auto;margin:20px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{font-weight:600;background:var(--surface)}
.tbl.num table{width:auto;min-width:min(100%,520px)}
.tbl.num td,.tbl.num th{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl.num td:first-child,.tbl.num th:first-child{text-align:left}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:20px 0}
.card{padding:20px 22px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.card ul,.card ol{margin:0;padding-left:1.2em}
.card > :last-child{margin-bottom:0}

/* diagrams */
.dg{margin:28px 0;padding:28px;border-radius:14px;background:var(--surface)}
.dg figcaption{margin-top:16px;font-size:14px;color:var(--mute)}
.bx{padding:12px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line);text-align:center;font-weight:500;line-height:1.4}
.bx small{font-weight:400;color:var(--mute)}
.bx.hi{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.bx.hi small{color:var(--acc-ink);opacity:.8}
.flow{display:flex;align-items:center;justify-content:center;gap:12px}
.flow.wrap{flex-wrap:wrap}
.ar{color:var(--mute);font-size:20px}
.stair{display:grid;gap:10px}
.st{display:grid;grid-template-columns:9em minmax(0,1fr);gap:16px;align-items:center;padding:12px 18px;border-radius:10px;background:var(--bg)}
.st span{color:var(--mute);font-size:15px}
.st.s2{margin-left:4%}.st.s3{margin-left:8%}.st.s4{margin-left:12%;background:var(--acc);color:var(--acc-ink)}.st.s4 span{color:var(--acc-ink);opacity:.85}
.pyr{display:grid;gap:8px;justify-items:center}
.pl{display:grid;padding:12px;border-radius:10px;background:var(--bg);text-align:center;line-height:1.4}
.pl span{font-size:14px;color:var(--mute)}
.pl.p1{width:40%;background:var(--acc);color:var(--acc-ink)}.pl.p1 span{color:var(--acc-ink);opacity:.85}.pl.p2{width:58%}.pl.p3{width:76%}.pl.p4{width:94%}
.side{margin:16px 0 0;text-align:center}
.org{display:grid;gap:16px;justify-items:center}
.org-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.org-row .bx{font-size:14px}
.split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.arms{display:grid;gap:12px}
.arm{padding:14px 18px;border-radius:10px;background:var(--bg)}
.cycle{display:grid;gap:8px}
.ph{display:grid;grid-template-columns:minmax(0,16em) minmax(0,1fr);gap:16px;align-items:center;padding:12px 18px;border-radius:10px;background:var(--bg)}
.ph span{color:var(--mute)}
.wf{display:grid;gap:8px}
.wf span{width:max-content;padding:8px 16px;border-radius:8px;background:var(--bg);font-weight:500}
.wf span:nth-child(2){margin-left:8%}.wf span:nth-child(3){margin-left:16%}.wf span:nth-child(4){margin-left:24%}.wf span:nth-child(5){margin-left:32%}.wf span:nth-child(6){margin-left:40%}
.gears{display:grid;gap:8px;justify-items:center}
.row3{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pill{padding:6px 16px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.pill.alt{background:var(--note);border-color:var(--note-line)}
.ar.dn{font-size:16px}
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:640px;margin-inline:auto}
.q{padding:18px;border-radius:10px;font-size:15px;line-height:1.5;background:var(--bg)}
.q b{display:block;font-size:22px;margin-bottom:4px}
.q.s b{color:var(--ok)}.q.w b{color:var(--bad)}.q.o b{color:var(--acc)}.q.t b{color:#a5652d}
.feas{display:grid;grid-template-areas:". n ." "w c e" ". s .";grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;justify-items:center;max-width:560px;margin-inline:auto}
.feas span{padding:10px 16px;border-radius:10px;background:var(--bg);font-weight:500}
.feas .n{grid-area:n}.feas .e{grid-area:e}.feas .w{grid-area:w}.feas .s{grid-area:s}
.feas .c{grid-area:c;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);text-align:center}
.tl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:12px;padding-top:16px;border-top:2px solid var(--hover-line)}
.tl span{position:relative;font-size:15px;font-weight:500}
.tl span::before{content:"";position:absolute;top:-24px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--acc)}
.ff{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-content:start}
.ff span{padding:26px 10px;border-radius:8px;background:var(--bg);text-align:center;font-size:14px}
.ff b{position:absolute;left:50%;top:80px;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font-size:13px;text-align:center}
.ff em{grid-column:1/-1;text-align:center;font-style:normal;font-weight:500;margin-top:8px}
.steps{margin:0;padding-left:1.4em;font-size:15px}
.steps li{padding:7px 0;border-bottom:1px solid var(--line)}
.fish{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bone{display:grid;gap:3px;padding:12px 16px;border-radius:10px;background:var(--bg);font-size:15px}
.bone span{color:var(--mute)}
.spine{grid-column:1/-1;padding:10px 16px;border-top:3px solid var(--acc);text-align:right;font-size:17px}
.sel{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);gap:12px;align-items:center}
.ins,.outs{display:grid;gap:6px;font-size:14px}
.ins span{padding:8px 10px;border-radius:8px;background:var(--bg);text-align:center}
.outs{padding:14px;border-radius:10px;background:var(--bg)}
.outs span{color:var(--mute)}
.curve{display:block;width:100%;height:240px}
.curve .ax{stroke:var(--hover-line);stroke-width:1.5}
.curve .ln{fill:none;stroke:var(--acc);stroke-width:3}
.curve text{font-size:13px;fill:var(--mute)}

/* questions */
.quiz{margin-top:56px;padding-top:36px;border-top:1px solid var(--line)}
.qcard{margin:0 0 24px;padding:26px 28px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.qcard.is-ok{border-color:var(--ok-line)}
.qcard.is-bad{border-color:var(--bad-line)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:10px;font-size:14px}
.qnum{font-weight:600;color:var(--mute)}
.tag{padding:2px 10px;border-radius:999px;background:var(--surface);color:var(--mute)}
.qtext{font-size:17px;font-weight:500;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;min-height:50px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15.5px;line-height:1.5;text-align:left;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--hover-line);background:var(--surface)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.ok{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.dim{color:var(--mute)}
.opt:disabled{cursor:default}
.letter{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--mute)}
.opt.ok .letter{background:var(--ok);color:var(--bg)}.opt.bad .letter{background:var(--bad);color:var(--bg)}
.explain{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.verdict{font-weight:600;margin-bottom:8px}
.is-ok .verdict{color:var(--ok)}.is-bad .verdict{color:var(--bad)}
.idea{padding:12px 16px;border-radius:10px;background:var(--surface)}
.whys{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.whys li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:8px 12px;border-radius:8px;color:var(--mute)}
.whys li b{color:var(--ink)}
.whys li.right{background:var(--ok-soft);color:var(--ink)}
.whys li.mine{background:var(--bad-soft);color:var(--ink)}
textarea{display:block;width:100%;margin-bottom:14px;padding:14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;line-height:1.6;color:var(--ink);background:var(--bg);resize:vertical}
textarea:focus{border-color:var(--acc);outline:none}
.model{padding:16px 20px;border-radius:10px;background:var(--ok-soft);margin-bottom:14px}
.model > :last-child{margin-bottom:0}
.summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;border-radius:12px;background:var(--surface)}

/* exam */
.exam > .muted{margin-bottom:28px}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:start;padding:28px;margin-bottom:32px;border-radius:14px;background:var(--surface)}
.result > div:first-child{display:grid}
.big{font-size:48px;font-weight:700;line-height:1;color:var(--acc)}
.result li{padding:4px 0}

/* review tools */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 16px}
.chip{min-height:40px;padding:6px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.chip:hover{border-color:var(--hover-line)}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:500}
.check{display:flex;align-items:center;gap:10px;margin-bottom:28px;color:var(--mute);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.flash{display:grid;width:100%;max-width:820px;margin:0 auto 24px;padding:0;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;perspective:1400px}
.face{grid-area:1/1;display:grid;place-content:center;gap:10px;min-height:300px;padding:40px;border-radius:18px;text-align:center;backface-visibility:hidden;transition:transform .5s ease}
.front{background:var(--surface);border:1px solid var(--line);font-size:clamp(24px,3vw,32px);font-weight:600}
.front small{font-size:13px;font-weight:600;color:var(--acc)}
.back{background:var(--acc-soft);border:1px solid var(--ex-line);font-size:18px;transform:rotateY(180deg)}
.flash.flipped .front{transform:rotateY(180deg)}.flash.flipped .back{transform:rotateY(360deg)}
.flash-controls{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;max-width:820px;margin:0 auto 12px}

.foot{margin-top:24px;border-top:1px solid var(--line);background:var(--surface)}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-block:28px;font-size:14px;color:var(--mute)}
.foot-in p{margin:0;flex:1 1 480px}
#boot{padding:80px 24px;text-align:center;color:var(--mute)}

/* highlights, notes, board */
mark.hl,span.hl{border-radius:3px;padding:1px 0;color:inherit;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-yellow{background:#fff1a6}.hl-green{background:#c9f0d6}.hl-pink{background:#ffd3e2}.hl-blue{background:#cfe1ff}
:root[data-theme=dark] .hl-yellow{background:#5c4f12}:root[data-theme=dark] .hl-green{background:#1d4a33}
:root[data-theme=dark] .hl-pink{background:#5a2238}:root[data-theme=dark] .hl-blue{background:#22385f}
mark.hl.has-note{border-bottom:2px dotted var(--ink)}
span.hl{cursor:default}
.lesson-tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:-8px 0 24px;padding:10px 14px;border-radius:12px;background:var(--surface)}
.lesson-tools .tip::before{content:"✎ ";}
.hl-toolbar{position:fixed;z-index:40;width:300px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:0 10px 30px var(--shadow)}
.hl-label{font-size:13px;color:var(--mute);margin-right:2px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;flex:none}
.swatch.on{outline:3px solid var(--acc);outline-offset:1px}
.sw-yellow{background:#ffe066}.sw-green{background:#7ad69b}.sw-pink{background:#ff9ec0}.sw-blue{background:#8cb6ff}
.hl-sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.hl-text-btn{border:0;background:none;color:var(--acc);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:6px 4px;white-space:nowrap}
.danger-text{color:var(--bad)!important}
.note-dialog{width:100%;max-width:560px;margin-top:6vh;padding:24px;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.note-quote{margin:0 0 14px;font-size:15px;max-height:120px;overflow:auto}
.row.end{justify-content:flex-end}
.my-notes{margin-top:40px;padding:22px;border-radius:14px;background:var(--note);border:1px solid var(--note-line)}
.my-notes-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.my-notes textarea{margin:6px 0 0;background:var(--bg)}
.hl-list{margin-top:14px}
.hl-list li{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.hl-list li span.hl{justify-self:start}
.hl-note{font-size:14px;color:var(--mute);padding-left:12px;border-left:3px solid var(--line)}
.note-card{margin-bottom:18px}
.note-card h3{margin-bottom:10px}
.note-text{white-space:pre-wrap;padding:12px 14px;border-radius:10px;background:var(--bg)}
.notes-actions{margin:0 0 28px}
.board-overlay{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--surface)}
.board-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.board-title{display:grid;line-height:1.25;margin-right:auto;min-width:120px}
.board-title span{font-size:13px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-group{display:flex;align-items:center;gap:6px;padding:4px;border-radius:12px;background:var(--surface)}
.tool-btn{min-height:40px;padding:6px 12px;border:0;border-radius:9px;background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.tool-btn.on{background:var(--bg);box-shadow:0 1px 4px var(--shadow);font-weight:600;color:var(--acc)}
.tool-btn:disabled{opacity:.4;cursor:default}
.ink-dot{width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);cursor:pointer;padding:0}
.ink-dot.on{outline:3px solid var(--acc)}
.size-btn{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:9px;background:none;cursor:pointer}
.size-btn span{display:block;border-radius:50%;background:var(--ink)}
.size-btn.on{background:var(--bg);box-shadow:0 1px 4px var(--shadow)}
.board-wrap{flex:1;min-height:0;display:grid;place-items:center;padding:16px}
.board-canvas{background-color:var(--bg);background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:24px 24px;border-radius:12px;box-shadow:0 4px 20px var(--shadow);touch-action:none;cursor:crosshair}
.board-canvas.tool-eraser{cursor:cell}
.board-foot{text-align:center;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;max-width:min(92vw,560px);padding:12px 16px;border-radius:12px;background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--ink)}
@media (max-width:640px){
.hl-toolbar{width:auto;left:8px!important;right:8px;top:auto!important;bottom:12px;justify-content:center}
.lesson-tools{margin-top:0}
.lesson-tools .row{width:100%}.lesson-tools .row .btn{flex:1}
.board-bar{gap:8px;padding:8px}
.board-title{display:none}
.board-group{gap:2px}
.tool-btn{padding:6px 8px}
.board-close{margin-left:auto}
.board-wrap{padding:8px}
}
/* edit mode: highlights painted with the CSS Custom Highlight API, ink layer, note pins */
::highlight(mk-yellow){background-color:#fff1a6;color:inherit}
::highlight(mk-green){background-color:#c9f0d6;color:inherit}
::highlight(mk-pink){background-color:#ffd3e2;color:inherit}
::highlight(mk-blue){background-color:#cfe1ff;color:inherit}
:root[data-theme=dark] ::highlight(mk-yellow){background-color:#6b5a14}
:root[data-theme=dark] ::highlight(mk-green){background-color:#1d4a33}
:root[data-theme=dark] ::highlight(mk-pink){background-color:#5a2238}
:root[data-theme=dark] ::highlight(mk-blue){background-color:#22385f}
.edit-btn.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
body.editing{padding-bottom:150px}
body.editing #page-root,body.editing #page-root *{-webkit-user-select:text;user-select:text}
body.editing #page-root button,body.editing #page-root a,body.editing #page-root label{cursor:text}
.ink-layer{position:absolute;z-index:20;pointer-events:none;overflow:visible}
.ink-layer.drawing{pointer-events:auto;touch-action:none;cursor:crosshair}
.ink-layer.tool-eraser{cursor:cell}
:root:not([data-theme=dark]) .ink-layer path[opacity="0.35"]{mix-blend-mode:multiply}
.note-pin{position:absolute;z-index:30;width:24px;height:24px;margin:-14px 0 0 -6px;display:grid;place-items:center;border:2px solid var(--bg);border-radius:50% 50% 50% 4px;background:#f2b705;color:#3a2c00;cursor:pointer;box-shadow:0 2px 6px var(--shadow);padding:0}
.note-pin.pin-hl{margin-left:2px}
.note-pin:hover{transform:scale(1.12)}
.edit-toolbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:45;width:max-content;max-width:calc(100vw - 20px);padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 12px 40px var(--shadow)}
.edit-hint{margin:0 4px 8px;font-size:13px;color:var(--mute)}
.edit-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.edit-group{display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;background:var(--surface)}
.edit-toolbar .ink-dot[data-c=yellow]:not([style*=background]){background:#ffe066}
.edit-toolbar .ink-dot[data-c=green]:not([style*=background]){background:#7ad69b}
.edit-toolbar .ink-dot[data-c=pink]:not([style*=background]){background:#ff9ec0}
.edit-toolbar .ink-dot[data-c=blue]:not([style*=background]){background:#8cb6ff}
.note-dialog-actions{justify-content:space-between;margin-top:6px}
@media (max-width:640px){
.edit-toolbar{left:8px;right:8px;transform:none;width:auto;bottom:8px;padding:8px}
.edit-hint{font-size:12px}
.edit-row{gap:6px}
.edit-group .tool-btn{padding:6px 8px;font-size:13px}
.edit-row > .btn{margin-left:auto}
body.editing{padding-bottom:200px}
}
@media (max-width:1200px){.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}.ch-grid{grid-template-columns:230px minmax(0,1fr);gap:40px}}
@media (max-width:1400px){
.menu-btn{display:inline-flex}
.nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;padding:10px clamp(16px,3.5vw,48px) 16px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 12px 24px var(--shadow)}
.nav.open{display:flex}
.nav a{padding:12px 14px;font-size:16px}
}
@media (max-width:900px){
.ch-grid{grid-template-columns:minmax(0,1fr);gap:20px}
.nav-toggle{display:none}
.ch-grid.nav-closed aside{display:block}
.ch-grid aside{position:sticky;top:64px;z-index:5;max-height:none;overflow:visible;margin:0 calc(-1 * clamp(16px,3.5vw,48px));padding:10px clamp(16px,3.5vw,48px);background:var(--top-bg);border-bottom:1px solid var(--line)}
.mobile-bar{display:flex;gap:8px;align-items:center}
.sections{display:none}
.two-col{grid-template-columns:minmax(0,1fr)}
.chapter{padding-top:28px}
.ch-head{margin-bottom:20px}
}
@media (max-width:640px){
body{font-size:15.5px;line-height:1.65}
.wrap{padding-inline:16px}
.top-in{gap:10px;min-height:60px}
.ch-grid aside{top:60px;margin:0 -16px;padding:10px 16px}
.theme-label,.kbd{display:none}
.search-backdrop{padding:0}.search-box{max-height:100vh;height:100%;border-radius:0;border:0}
.home{padding-top:36px}
.intro{margin-bottom:32px}
.intro .btn{width:100%}
.chapters,.two,.fish,.swot{grid-template-columns:minmax(0,1fr)}

.st,.ph{grid-template-columns:minmax(0,1fr);gap:4px}
.st.s2,.st.s3,.st.s4,.wf span{margin-left:0!important}
.pl.p1,.pl.p2,.pl.p3,.pl.p4{width:100%}
.split,.sel{grid-template-columns:minmax(0,1fr)}
.sel .ar,.split .ar{justify-self:center;transform:rotate(90deg)}
.flow{flex-direction:column;align-items:stretch}.flow .ar{transform:rotate(90deg);align-self:center}
.feas{grid-template-areas:"n" "c" "w" "e" "s";grid-template-columns:minmax(0,1fr)}
.feas .c{width:100px;height:100px;justify-self:center}
.dg{padding:16px}
.note,.ex,.trap,.extra,.formula{padding:14px 16px}
blockquote{padding:14px 16px;font-size:16px}
.qcard{padding:18px 16px;border-radius:12px}

.pager{flex-direction:column-reverse;gap:10px}.pager .btn{max-width:none;width:100%}

h1{font-size:28px}h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
